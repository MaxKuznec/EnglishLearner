<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<title>English Learner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; }
  .app { background: #fff; width: 100%; max-width: 560px; min-height: 100vh; display: flex; flex-direction: column; }

  header { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 14px 14px 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .top + .top { margin-top: 10px; }
  h1 { font-size: 20px; }
  .top label { font-size: 14px; }
  select { padding: 8px; border-radius: 8px; border: none; font-size: 15px; background: #fff; color: #333; min-height: 40px; }
  .stats { display: flex; justify-content: space-around; margin-top: 12px; background: rgba(255,255,255,.18); border-radius: 12px; padding: 10px; }
  .stat-value { font-size: 20px; font-weight: bold; text-align: center; }
  .stat-label { font-size: 11px; opacity: .9; text-align: center; }

  nav { display: flex; overflow-x: auto; gap: 6px; padding: 10px; background: #f0f0f0; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: 0 0 auto; background: transparent; color: #666; padding: 10px 14px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; min-height: 44px; cursor: pointer; }
  nav button.active { background: #fff; color: #667eea; box-shadow: 0 2px 5px rgba(0,0,0,.1); }

  main { padding: 16px; flex: 1; }
  .progress { background: #e0e0e0; border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 14px; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width .3s; }

  .card { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-radius: 16px; padding: 36px 18px; text-align: center; min-height: 200px; display: flex; flex-direction: column; justify-content: center; user-select: none; touch-action: pan-y; cursor: pointer; }
  .word { font-size: 30px; font-weight: bold; margin-bottom: 10px; word-break: break-word; }
  .translation { font-size: 22px; opacity: .95; word-break: break-word; }
  .hint { font-size: 13px; opacity: .8; margin-top: 14px; }
  .hint.dark { color: #888; opacity: 1; text-align: center; margin-top: 10px; }

  .row { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; min-height: 52px; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; color: #fff; background: #667eea; cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn-known { background: #4caf50; }
  .btn-unknown { background: #ff9800; }
  .btn-sec { background: #e0e0e0; color: #333; }

  .question { font-size: 21px; font-weight: bold; text-align: center; margin-bottom: 16px; color: #333; word-break: break-word; }
  .question.small { font-size: 16px; font-weight: normal; color: #555; }
  .opt { display: block; width: 100%; min-height: 52px; padding: 12px 14px; margin: 8px 0; background: #f5f5f5; border: 2px solid transparent; border-radius: 12px; text-align: left; font-size: 16px; color: #333; cursor: pointer; }
  .opt.correct { background: #c8e6c9; border-color: #4caf50; }
  .opt.wrong { background: #ffcdd2; border-color: #f44336; }

  input[type=text] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #ddd; border-radius: 12px; margin-top: 10px; }
  input[type=text]:focus { outline: none; border-color: #667eea; }
  .feedback { margin-top: 12px; font-size: 16px; text-align: center; min-height: 24px; font-weight: 600; }
  .ok { color: #2e7d32; }
  .bad { color: #c62828; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid > div { display: flex; flex-direction: column; gap: 10px; }
  .tile { min-height: 56px; border-radius: 12px; background: #f5f5f5; border: 2px solid transparent; font-size: 16px; color: #333; font-weight: 600; cursor: pointer; padding: 6px; word-break: break-word; }
  .tile.sel { background: #e8eaf6; border-color: #667eea; }
  .tile.done { background: #c8e6c9; border-color: #4caf50; color: #2e7d32; cursor: default; }
  .tile.wrong { background: #ffcdd2; border-color: #f44336; }
  .letters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
  .letters .tile { min-width: 52px; flex: 0 0 auto; }
  .answer { min-height: 56px; border: 2px dashed #bbb; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 8px; font-size: 22px; font-weight: bold; color: #333; word-break: break-all; }
  .speak { background: #764ba2; color: #fff; min-height: 56px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 12px; cursor: pointer; }
  .hidden { display: none !important; }

  @media (max-width: 360px) {
    .word { font-size: 24px; }
    .translation { font-size: 18px; }
    .question { font-size: 18px; }
    .grid { gap: 6px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="top">
      <h1 id="appTitle"></h1>
      <select id="uiLang" aria-label="Interface language">
        <option value="ru">RU</option>
        <option value="en">EN</option>
        <option value="de">DE</option>
      </select>
    </div>
    <div class="top">
      <label id="tgtLabel" for="tgtLang"></label>
      <select id="tgtLang">
        <option value="ru">Русский</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
    </div>
    <div class="stats">
      <div><div class="stat-value" id="learned">0</div><div class="stat-label" id="lblLearned"></div></div>
      <div><div class="stat-value" id="score">0</div><div class="stat-label" id="lblScore"></div></div>
      <div><div class="stat-value" id="total">0</div><div class="stat-label" id="lblTotal"></div></div>
    </div>
  </header>

  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
  // ============ СЛОВАРЬ ============
  const WORDS = [
    { en: "apple",    ru: "яблоко",   de: "Apfel",   es: "manzana", fr: "pomme" },
    { en: "house",    ru: "дом",      de: "Haus",    es: "casa",    fr: "maison" },
    { en: "book",     ru: "книга",    de: "Buch",    es: "libro",   fr: "livre" },
    { en: "cat",      ru: "кошка",    de: "Katze",   es: "gato",    fr: "chat" },
    { en: "dog",      ru: "собака",   de: "Hund",    es: "perro",   fr: "chien" },
    { en: "water",    ru: "вода",     de: "Wasser",  es: "agua",    fr: "eau" },
    { en: "sun",      ru: "солнце",   de: "Sonne",   es: "sol",     fr: "soleil" },
    { en: "moon",     ru: "луна",     de: "Mond",    es: "luna",    fr: "lune" },
    { en: "tree",     ru: "дерево",   de: "Baum",    es: "árbol",   fr: "arbre" },
    { en: "friend",   ru: "друг",     de: "Freund",  es: "amigo",   fr: "ami" },
    { en: "car",      ru: "машина",   de: "Auto",    es: "coche",   fr: "voiture" },
    { en: "school",   ru: "школа",    de: "Schule",  es: "escuela", fr: "école" },
    { en: "flower",   ru: "цветок",   de: "Blume",   es: "flor",    fr: "fleur" },
    { en: "river",    ru: "река",     de: "Fluss",   es: "río",     fr: "rivière" },
    { en: "mountain", ru: "гора",     de: "Berg",    es: "montaña", fr: "montagne" },
    { en: "bird",     ru: "птица",    de: "Vogel",   es: "pájaro",  fr: "oiseau" },
    { en: "city",     ru: "город",    de: "Stadt",   es: "ciudad",  fr: "ville" },
    { en: "family",   ru: "семья",    de: "Familie", es: "familia", fr: "famille" },
    { en: "money",    ru: "деньги",   de: "Geld",    es: "dinero",  fr: "argent" },
    { en: "work",     ru: "работа",   de: "Arbeit",  es: "trabajo", fr: "travail" }
  ];

  // ============ ИНТЕРФЕЙС ============
  const UI = {
    ru: {
      title: "🇬🇧 English Learner", tgtLabel: "Перевод на:", learned: "Изучено", score: "Очки", total: "Всего",
      known: "✅ Знаю", unknown: "❌ Не знаю", next: "➡️ Далее", restart: "🔄 Начать заново", roundDone: "Раунд завершён",
      tapFlip: "Нажми, чтобы увидеть перевод", knowIt: "Знаешь это слово?", swipeHint: "Свайп вправо — знаю, влево — не знаю",
      quizQ: 'Как переводится "{w}"?', typeQ: 'Как будет по-английски "{w}"?', typePh: "Введите слово",
      skip: "Пропустить", check: "Проверить", clear: "Сбросить", matchHint: "Соедините английские слова с переводами",
      scrHint: "Соберите слово из букв", speak: "Послушать", ok: "Верно!", bad: "Неверно. Правильно:",
      tab_flash: "📖 Карточки", tab_quiz: "✅ Тест", tab_type: "⌨️ Ввод", tab_match: "🔗 Пары", tab_scramble: "🔀 Буквы", tab_listen: "🔊 Слух"
    },
    en: {
      title: "🇬🇧 English Learner", tgtLabel: "Translate to:", learned: "Learned", score: "Score", total: "Total",
      known: "✅ Know it", unknown: "❌ Don't know", next: "➡️ Next", restart: "🔄 Start over", roundDone: "Round complete",
      tapFlip: "Tap to see the translation", knowIt: "Do you know this word?", swipeHint: "Swipe right — know it, left — don't",
      quizQ: 'What does "{w}" mean?', typeQ: 'How do you say "{w}" in English?', typePh: "Type the word",
      skip: "Skip", check: "Check", clear: "Clear", matchHint: "Match English words with their translations",
      scrHint: "Build the word from the letters", speak: "Listen", ok: "Correct!", bad: "Wrong. Answer:",
      tab_flash: "📖 Cards", tab_quiz: "✅ Quiz", tab_type: "⌨️ Type", tab_match: "🔗 Match", tab_scramble: "🔀 Letters", tab_listen: "🔊 Listen"
    },
    de: {
      title: "🇬🇧 Englisch lernen", tgtLabel: "Übersetzung auf:", learned: "Gelernt", score: "Punkte", total: "Gesamt",
      known: "✅ Gewusst", unknown: "❌ Nicht gewusst", next: "➡️ Weiter", restart: "🔄 Neu starten", roundDone: "Runde beendet",
      tapFlip: "Tippen für die Übersetzung", knowIt: "Kennst du dieses Wort?", swipeHint: "Nach rechts wischen — gewusst, nach links — nicht",
      quizQ: 'Was bedeutet "{w}"?', typeQ: 'Wie sagt man "{w}" auf Englisch?', typePh: "Wort eingeben",
      skip: "Überspringen", check: "Prüfen", clear: "Leeren", matchHint: "Ordne die englischen Wörter den Übersetzungen zu",
      scrHint: "Setze das Wort aus den Buchstaben zusammen", speak: "Anhören", ok: "Richtig!", bad: "Falsch. Richtig:",
      tab_flash: "📖 Karten", tab_quiz: "✅ Quiz", tab_type: "⌨️ Eingabe", tab_match: "🔗 Paare", tab_scramble: "🔀 Buchstaben", tab_listen: "🔊 Hören"
    }
  };

  const TABS = ['flash', 'quiz', 'type', 'match', 'scramble', 'listen'];

  // ============ СОСТОЯНИЕ ============
  const $ = id => document.getElementById(id);
  const defaults = { ui: 'ru', tgt: 'ru', score: 0, learned: [] };
  let S;
  try {
    S = Object.assign({}, defaults, JSON.parse(localStorage.getItem('el') || '{}'));
  } catch (e) {
    S = Object.assign({}, defaults);
  }
  let tab = 'flash';
  let st = {};
  let justSwiped = false;

  function save() {
    try { localStorage.setItem('el', JSON.stringify(S)); } catch (e) {}
  }
  function t(k) { return UI[S.ui][k] || UI.en[k] || k; }
  function shuffle(a) {
    const b = [...a];
    for (let i = b.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function distractors(w) {
    return shuffle(WORDS.filter(x => x !== w && x[S.tgt] !== w[S.tgt])).slice(0, 3);
  }
  function addScore(n) { S.score += n; save(); updateStats(); }
  function learn(en) {
    if (!S.learned.includes(en)) S.learned.push(en);
    save(); updateStats();
  }
  function updateStats() {
    $('learned').textContent = S.learned.length;
    $('score').textContent = S.score;
    $('total').textContent = WORDS.length;
  }
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }

    // ============ НАВИГАЦИЯ И ЯЗЫК ============
  function applyLang() {
    document.documentElement.lang = S.ui;
    $('uiLang').value = S.ui;
    $('tgtLang').value = S.tgt;
    $('appTitle').textContent = t('title');
    $('tgtLabel').textContent = t('tgtLabel');
    $('lblLearned').textContent = t('learned');
    $('lblScore').textContent = t('score');
    $('lblTotal').textContent = t('total');
    renderNav();
    render();
    updateStats();
  }

  function renderNav() {
    $('nav').innerHTML = TABS.map(k =>
      `<button class="${k === tab ? 'active' : ''}" onclick="setTab('${k}')">${t('tab_' + k)}</button>`
    ).join('');
  }

  function setTab(k) {
    tab = k;
    st = {};
    applyLang();
  }

  function render() {
    const map = {
      flash: renderFlash, quiz: renderQuiz, type: renderType,
      match: renderMatch, scramble: renderScramble, listen: renderListen
    };
    map[tab]();
  }

  // ============ КАРТОЧКИ ============
  function renderFlash() {
    const m = $('main');
    if (st.i === undefined) st.i = 0;
    if (st.i >= WORDS.length) {
      m.innerHTML = `<div class="card"><div class="word">🎉</div>
        <div class="translation">${t('roundDone')}: ${S.learned.length}/${WORDS.length}</div></div>
        <div class="row"><button class="btn" onclick="st.i=0;render()">${t('restart')}</button></div>`;
      return;
    }
    const w = WORDS[st.i];
    st.flipped = false;
    m.innerHTML = `
      <div class="progress"><div class="progress-bar" style="width:${st.i / WORDS.length * 100}%"></div></div>
      <div class="card" id="card" onclick="if(!justSwiped)flip()">
        <div class="word">${w.en}</div>
        <div class="translation hidden" id="tr">${w[S.tgt]}</div>
        <div class="hint" id="hint">${t('tapFlip')}</div>
      </div>
      <div class="row">
        <button class="btn btn-unknown" onclick="flashMark(false)">${t('unknown')}</button>
        <button class="btn btn-known" onclick="flashMark(true)">${t('known')}</button>
      </div>
      <div class="hint dark">${t('swipeHint')}</div>`;
    bindSwipe($('card'), dir => flashMark(dir));
  }

  function flip() {
    st.flipped = true;
    $('tr').classList.remove('hidden');
    $('hint').textContent = t('knowIt');
  }

  function flashMark(known) {
    if (!st.flipped) { flip(); return; }
    if (known) { learn(WORDS[st.i].en); addScore(10); }
    st.i++;
    render();
  }

  function bindSwipe(el, cb) {
    let x0 = null;
    el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      x0 = null;
      if (Math.abs(dx) > 70) {
        justSwiped = true;
        setTimeout(() => { justSwiped = false; }, 400);
        cb(dx > 0);
      }
    });
  }

  // ============ ТЕСТ С ВЫБОРОМ ============
  function renderQuiz() {
    const w = pick(WORDS);
    st.cur = w;
    st.opts = shuffle([w, ...distractors(w)]);
    st.answered = false;
    $('main').innerHTML = `
      <div class="question">${t('quizQ').replace('{w}', w.en)}</div>
      <div id="opts">${st.opts.map((o, i) =>
        `<button class="opt" onclick="answerChoice(${i})">${o[S.tgt]}</button>`).join('')}</div>
      <div class="row"><button class="btn" onclick="renderQuiz()">${t('next')}</button></div>`;
  }

  function answerChoice(i) {
    if (st.answered) return;
    st.answered = true;
    const btns = document.querySelectorAll('#opts .opt');
    const right = st.opts.indexOf(st.cur);
    if (i === right) {
      btns[i].classList.add('correct');
      addScore(15);
      learn(st.cur.en);
    } else {
      btns[i].classList.add('wrong');
      btns[right].classList.add('correct');
    }
  }

  // ============ ВВОД ПЕРЕВОДА ============
  function renderType() {
    const w = pick(WORDS);
    st.cur = w;
    st.answered = false;
    $('main').innerHTML = `
      <div class="question">${t('typeQ').replace('{w}', w[S.tgt])}</div>
      <input type="text" id="inp" autocomplete="off" autocapitalize="none" spellcheck="false"
        placeholder="${t('typePh')}" onkeydown="if(event.key==='Enter')typeAction()">
      <div class="feedback" id="fb"></div>
      <div class="row">
        <button class="btn btn-sec" onclick="renderType()">${t('skip')}</button>
        <button class="btn" id="act" onclick="typeAction()">${t('check')}</button>
      </div>`;
  }

  function typeAction() {
    if (st.answered) { renderType(); return; }
    const v = $('inp').value.trim().toLowerCase();
    if (!v) return;
    st.answered = true;
    if (v === st.cur.en) {
      $('fb').innerHTML = `<span class="ok">${t('ok')}</span>`;
      addScore(15);
      learn(st.cur.en);
    } else {
      $('fb').innerHTML = `<span class="bad">${t('bad')} ${st.cur.en}</span>`;
    }
    $('inp').disabled = true;
    $('act').textContent = t('next');
  }

  // ============ СОПОСТАВЛЕНИЕ ПАР ============
  function renderMatch() {
    const set = shuffle(WORDS).slice(0, 5);
    st.pairs = set;
    st.left = shuffle(set);
    st.right = shuffle(set);
    st.selE = null;
    st.selT = null;
    st.matched = 0;
    $('main').innerHTML = `
      <p class="question small">${t('matchHint')}</p>
      <div class="grid">
        <div id="colE">${st.left.map((w, i) =>
          `<button class="tile" data-i="${i}" onclick="matchPick('E',${i})">${w.en}</button>`).join('')}</div>
        <div id="colT">${st.right.map((w, i) =>
          `<button class="tile" data-i="${i}" onclick="matchPick('T',${i})">${w[S.tgt]}</button>`).join('')}</div>
      </div>
      <div class="feedback" id="fb"></div>`;
  }

  function matchPick(side, i) {
    const col = `#col${side}`;
    const el = document.querySelector(`${col} [data-i="${i}"]`);
    if (el.classList.contains('done')) return;
    document.querySelectorAll(`${col} .tile`).forEach(b => b.classList.remove('sel'));
    el.classList.add('sel');
    if (side === 'E') st.selE = i; else st.selT = i;
    if (st.selE === null || st.selT === null) return;

    const eE = document.querySelector(`#colE [data-i="${st.selE}"]`);
    const eT = document.querySelector(`#colT [data-i="${st.selT}"]`);
    if (st.left[st.selE] === st.right[st.selT]) {
      eE.classList.replace('sel', 'done');
      eT.classList.replace('sel', 'done');
      learn(st.left[st.selE].en);
      addScore(5);
      st.matched++;
      if (st.matched === st.pairs.length) {
        $('fb').innerHTML = `<span class="ok">${t('roundDone')}</span>
          <div class="row"><button class="btn" onclick="renderMatch()">${t('restart')}</button></div>`;
      }
    } else {
      eE.classList.add('wrong');
      eT.classList.add('wrong');
      setTimeout(() => { [eE, eT].forEach(x => x.classList.remove('wrong', 'sel')); }, 600);
    }
    st.selE = null;
    st.selT = null;
  }

  // ============ СБОРКА СЛОВА ИЗ БУКВ ============
  function renderScramble() {
    const w = pick(WORDS);
    let order = shuffle([...w.en]);
    while (order.join('') === w.en && w.en.length > 1) order = shuffle(order);
    st.cur = w;
    st.letters = order;
    st.typed = [];
    $('main').innerHTML = `
      <div class="question">${w[S.tgt]}</div>
      <p class="hint dark">${t('scrHint')}</p>
      <div class="answer" id="ans"></div>
      <div class="letters">${order.map((c, i) =>
        `<button class="tile" data-i="${i}" onclick="scrPick(${i})">${c}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="row">
        <button class="btn btn-sec" onclick="scrClear()">${t('clear')}</button>
        <button class="btn" onclick="scrCheck()">${t('check')}</button>
      </div>`;
  }

  function scrPick(i) {
    const el = document.querySelector(`#main .letters [data-i="${i}"]`);
    if (el.classList.contains('done')) return;
    el.classList.add('done');
    st.typed.push(i);
    showAns();
  }

  function showAns() {
    $('ans').textContent = st.typed.map(j => st.letters[j]).join('');
  }

  function scrClear() {
    st.typed = [];
    showAns();
    $('fb').textContent = '';
    document.querySelectorAll('#main .letters .tile').forEach(b => b.classList.remove('done'));
  }

  function scrCheck() {
    const v = st.typed.map(j => st.letters[j]).join('');
    if (v === st.cur.en) {
      $('fb').innerHTML = `<span class="ok">${t('ok')}</span>`;
      addScore(10);
      learn(st.cur.en);
      setTimeout(() => { if (tab === 'scramble') renderScramble(); }, 900);
    } else {
      $('fb').innerHTML = `<span class="bad">${t('bad')} ${st.cur.en}</span>`;
    }
  }

  // ============ АУДИРОВАНИЕ ============
  function renderListen() {
    const w = pick(WORDS);
    st.cur = w;
    st.opts = shuffle([w, ...distractors(w)]);
    st.answered = false;
    $('main').innerHTML = `
      <button class="speak" onclick="speak('${w.en}')">🔊 ${t('speak')}</button>
      <div id="opts">${st.opts.map((o, i) =>
        `<button class="opt" onclick="answerChoice(${i})">${o[S.tgt]}</button>`).join('')}</div>
      <div class="row"><button class="btn" onclick="renderListen()">${t('next')}</button></div>`;
    speak(w.en);
  }

  // ============ ИНИЦИАЛИЗАЦИЯ ============
  $('uiLang').onchange = e => { S.ui = e.target.value; save(); applyLang(); };
  $('tgtLang').onchange = e => { S.tgt = e.target.value; save(); st = {}; applyLang(); };
  applyLang();
</script>
</body>
</html>
