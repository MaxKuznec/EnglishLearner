plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.englishlearner'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.englishlearner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../release.jks")
            storePassword System.getenv("KS_PASS") ?: "changeit"
            keyAlias "key"
            keyPassword System.getenv("KS_PASS") ?: "changeit"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
